---
- name: Set timezone
  community.general.timezone:
    name: UTC

- name: Create 1 GB swap file (small instances run out of memory without it)
  ansible.builtin.command: fallocate -l 1G /swapfile
  args:
    creates: /swapfile

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  changed_when: true
  when: ansible_swaptotal_mb | int == 0

- name: Enable swap now
  ansible.builtin.command: swapon /swapfile
  changed_when: true
  when: ansible_swaptotal_mb | int == 0

- name: Keep swap enabled after reboot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Install base packages (Debian family)
  ansible.builtin.apt:
    name: [curl, vim, htop, chrony, ufw, python3-docker]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Enable EPEL repository (RedHat family)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_os_family == "RedHat"

- name: Install base packages (RedHat family)
  ansible.builtin.dnf:
    name: [curl, vim-enhanced, htop, chrony, firewalld, policycoreutils-python-utils]
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable chrony
  ansible.builtin.service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true
