---
- name: Harden SSH daemon (drop-in file, validated before it is written)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/01-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (hardening role). Do not edit by hand.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
