plugin: amazon.aws.aws_ec2
regions:
  - us-east-2
filters:
  tag:ManagedBy: terraform
  instance-state-name: running
hostnames:
  - tag:Name
compose:
  ansible_host: public_ip_address
keyed_groups:
  - key: ec2_tags.Role
    prefix: role
  - key: ec2_tags.Env # gitleaks:allow (inventory key name, not a secret)
    prefix: env
