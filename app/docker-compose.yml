services:
  web:
    build: .
    image: app:1.0
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: "1.0"
    depends_on:
      cache:
        condition: service_healthy
    networks: [back]
  cache:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    volumes:
      - cachedata:/data
    networks: [back]
volumes:
  cachedata: {}
networks:
  back: {}
